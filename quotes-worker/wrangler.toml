# Cloudflare Worker – izodiamant-quotes (cenové nabídky: PDF, AI, schránka info@).
#
# Není veřejně dostupný (workers_dev = false, žádné routy). Volá ho jen admin
# /sprava přes service binding `QUOTES` z workeru webu (wrangler.jsonc) a cron (čtení schránky).
#
# Dvě oddělená prostředí se samostatnou D1 i R2:
#   production → izodiamant-quotes          (izodiamant-db,         izodiamant-nabidky)
#   preview    → izodiamant-quotes-preview  (izodiamant-preview-db, izodiamant-nabidky-preview)
#
# Secrety (nejsou tady, nastavují se zvlášť pro každé prostředí):
#   npx wrangler secret put MAILBOX_PASSWORD               # produkce
#   npx wrangler secret put MAILBOX_PASSWORD --env preview # preview (testovací schránka)
#   npx wrangler secret put OPENCODE_API_KEY               # OpenCode Zen (AI) – produkce
#   npx wrangler secret put OPENCODE_API_KEY --env preview # OpenCode Zen (AI) – preview
#
# Bindingy a vars se NEDĚDÍ do [env.preview] – při změně je upravte v obou blocích.

name = "izodiamant-quotes"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[limits]
cpu_ms = 60000

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

# Fronta na čtení plánků. Rozbor výkresu trvá i přes 2 minuty – do HTTP požadavku
# z administrace se to nevejde (edge ho po ~100 s ukončí) a waitUntil má jen 30 s.
# Producent (fetch) úlohu zařadí, consumer (queue) ji v klidu dopočítá (limit 15 min).
[[queues.producers]]
binding = "JOBS"
queue = "izodiamant-quotes-jobs"

[[queues.consumers]]
queue = "izodiamant-quotes-jobs"
max_batch_size = 1
max_concurrency = 2
max_retries = 1

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "izodiamant-db"
database_id = "ab044201-17db-44d4-8826-adfc65a4c18d"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "izodiamant-nabidky"

[vars]
ENVIRONMENT = "production"
# Modely podle úlohy, tvar "<ovladač>:<model>" (viz src/ai.ts):
#   zen:…       OpenCode Zen – hlavní brána, secret OPENCODE_API_KEY
#   anthropic:… Claude API přímo, secret ANTHROPIC_API_KEY
#   cf:…        Workers AI (bez klíče)
# Levné a časté úlohy na malý model, čtení plánků/výkazů na silný. Víc modelů čárkou =
# zkouší se popořadě (GPT-5 nano je ~20× levnější než Haiku a umí i obrázky).
AI_TRIAGE_MODEL = "zen:gpt-5-nano,zen:claude-haiku-4-5"
AI_ATTACHMENT_MODEL = "zen:gpt-5-nano,zen:claude-haiku-4-5"
AI_EXTRACT_MODEL = "zen:claude-opus-5-5"
AI_TEXT_MODEL = "zen:claude-sonnet-5"
# Když komerční model selže (výpadek, došel kredit, chybí klíč) – úloha se zopakuje zde.
AI_FALLBACK_MODEL = "cf:@cf/google/gemma-4-26b-a4b-it"
# Schránka, ze které se čtou poptávky a do které se ukládají koncepty odpovědí.
MAILBOX_USER = "info@izodiamant.cz"
MAILBOX_SENDER_NAME = "Václav Ropek – IZODIAMANT"
IMAP_HOST = "imap.seznam.cz"
IMAP_PORT = "993"
SMTP_HOST = "smtp.seznam.cz"
SMTP_PORT = "465"
# Fáze 2 – automatické čtení schránky (cron). Bez secretu MAILBOX_PASSWORD se běh
# rovnou ukončí, takže se schránky nic nedotkne, dokud heslo nenastavíte.
INBOX_ENABLED = "true"
INBOX_FOLDER = "INBOX"
INBOX_ARCHIVE_FOLDER = "Zpracované poptávky"
INBOX_LABEL = "nabidka"
INBOX_LOOKBACK_DAYS = "3"
INBOX_MAX_PER_RUN = "10"
# Prázdné = složka se najde podle IMAP special-use (\Drafts, \Sent).
DRAFTS_FOLDER = ""
SENT_FOLDER = ""
# Fáze 3b – přímé odeslání z aplikace. Do té doby jen koncepty do schránky.
SEND_ENABLED = "false"

[env.preview]
name = "izodiamant-quotes-preview"
workers_dev = false
preview_urls = false

[env.preview.triggers]
crons = ["*/15 * * * *"]

[[env.preview.queues.producers]]
binding = "JOBS"
queue = "izodiamant-quotes-jobs-preview"

[[env.preview.queues.consumers]]
queue = "izodiamant-quotes-jobs-preview"
max_batch_size = 1
max_concurrency = 2
max_retries = 1

[env.preview.ai]
binding = "AI"

[env.preview.browser]
binding = "BROWSER"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "izodiamant-preview-db"
database_id = "fb43aba4-c91a-4d90-8758-e473815ddee1"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "izodiamant-nabidky-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
AI_TRIAGE_MODEL = "zen:gpt-5-nano,zen:claude-haiku-4-5"
AI_ATTACHMENT_MODEL = "zen:gpt-5-nano,zen:claude-haiku-4-5"
AI_EXTRACT_MODEL = "zen:claude-opus-5-5"
AI_TEXT_MODEL = "zen:claude-sonnet-5"
AI_FALLBACK_MODEL = "cf:@cf/google/gemma-4-26b-a4b-it"
# TESTOVACÍ schránka (heslo: wrangler secret put MAILBOX_PASSWORD --env preview).
MAILBOX_USER = "tesquotes-test@izodiamant.cz"
MAILBOX_SENDER_NAME = "Václav Ropek – IZODIAMANT (TEST)"
IMAP_HOST = "imap.seznam.cz"
IMAP_PORT = "993"
SMTP_HOST = "smtp.seznam.cz"
SMTP_PORT = "465"
INBOX_ENABLED = "true"
INBOX_FOLDER = "INBOX"
INBOX_ARCHIVE_FOLDER = "Zpracované poptávky"
INBOX_LABEL = "nabidka"
INBOX_LOOKBACK_DAYS = "3"
INBOX_MAX_PER_RUN = "10"
DRAFTS_FOLDER = ""
SENT_FOLDER = ""
SEND_ENABLED = "false"
