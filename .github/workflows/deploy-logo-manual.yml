name: Deploy Logo Manual

# Nasadí Cloudflare Worker izodiamant-logo-manual (logo-manual.izodiamant.cz) při změně
# logo-manual/** na master. Samostatný worker, nezávislý na hlavním webu.
on:
  push:
    branches: [master]
    paths:
      - 'logo-manual/**'
      - '.github/workflows/deploy-logo-manual.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Chybí secrets – přeskočeno
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN není nastaven → deploy přeskočen (viz deployment.MD)."

      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: logo-manual
