name: Deploy Quotes Worker

# Nasadí quotes-worker (cenové nabídky: PDF, AI, schránka) a aplikuje schéma D1.
#   push na master      → produkce  (izodiamant-quotes,         izodiamant-db)
#   push na jinou větev → preview   (izodiamant-quotes-preview, izodiamant-preview-db)
# Preview worker je jeden sdílený pro všechny větve – nasazuje se poslední push.
# Schéma je idempotentní (CREATE … IF NOT EXISTS), opakované spuštění nic nerozbije.
# Nové sloupce do existujících tabulek přidávají db/migrations/*.sql (ALTER TABLE) –
# pouští se po jednom příkazu a „duplicate column name“ znamená, že už proběhly.
on:
  push:
    paths:
      - 'quotes-worker/**'
      - 'src/lib/quotes/**'
      - 'src/data/calculator.json'
      - 'db/schema.sql'
      - 'db/migrations/**'
      - '.github/workflows/deploy-quotes-worker.yml'
  workflow_dispatch: {}

concurrency:
  group: quotes-worker-${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET: ${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - name: Chybí secrets – přeskočeno
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN není nastaven → deploy přeskočen (viz deployment.MD)."

      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quotes-worker/package-lock.json

      - name: Instalace závislostí
        if: env.CF_TOKEN != ''
        working-directory: quotes-worker
        run: npm ci

      - name: Schéma D1 (${{ env.TARGET }})
        if: env.CF_TOKEN != ''
        working-directory: quotes-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = production ]; then
            npx wrangler d1 execute izodiamant-db --remote --file=../db/schema.sql
          else
            npx wrangler d1 execute izodiamant-preview-db --remote --env preview --file=../db/schema.sql
          fi

      - name: Migrace D1 (${{ env.TARGET }})
        if: env.CF_TOKEN != ''
        working-directory: quotes-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = production ]; then DB="izodiamant-db"; ENVFLAG=""; else DB="izodiamant-preview-db"; ENVFLAG="--env preview"; fi
          for f in ../db/migrations/*.sql; do
            [ -e "$f" ] || continue
            grep -E '^[[:space:]]*ALTER TABLE' "$f" | while IFS= read -r stmt; do
              if out=$(npx wrangler d1 execute "$DB" --remote $ENVFLAG --command "$stmt" < /dev/null 2>&1); then
                echo "OK: $stmt"
              elif echo "$out" | grep -qi "duplicate column"; then
                echo "Už je: $stmt"
              else
                echo "$out"; exit 1
              fi
            done
          done

      - name: Deploy (${{ env.TARGET }})
        if: env.CF_TOKEN != ''
        working-directory: quotes-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Secret MAILBOX_PASSWORD je uložený v Cloudflare, deploy ho zachová.
        run: |
          if [ "$TARGET" = production ]; then npx wrangler deploy; else npx wrangler deploy --env preview; fi
