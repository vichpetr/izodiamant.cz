name: FB auto-poster

# Běží denně; skript sám rozhodne podle dne v týdnu (Europe/Prague):
#   pondělí → naplánuje FB post k další referenci,
#   čtvrtek → naplánuje FB post k dalšímu (už zveřejněnému) článku,
# oba na dnešek v 11:30. Text bere z pole `fbPost` v references.json / articles.json.
#
# Běží po ranním rebuildu (scheduled-rebuild.yml v 04:10 UTC), aby byl obsah na
# webu už aktuální a Facebook si stáhl správný náhled z OG tagů.
#
# Vyžaduje repo secrets:
#   FB_PAGE_ID            – ID firemní FB stránky
#   FB_PAGE_ACCESS_TOKEN  – Page/System User token s pages_manage_posts
# Bez nich skript jen tiše doběhne (nic nenaplánuje), takže workflow nepadá.
on:
  schedule:
    - cron: '20 6 * * *' # 06:20 UTC – po denním rebuildu, ještě dopoledne
  workflow_dispatch:
    inputs:
      force_kind:
        description: 'Ruční test: vynutit typ postu bez ohledu na den (prázdné = podle dne)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - reference
          - article

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Schedule today's FB post
        env:
          TZ: Europe/Prague
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_FORCE_KIND: ${{ github.event.inputs.force_kind }}
        run: node scripts/fb-schedule.mjs
