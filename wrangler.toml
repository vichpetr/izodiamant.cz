# Cloudflare Worker – web izodiamant.cz (Next.js přes OpenNext, build: `npm run build:worker`).
#
# Záměrně TOML, ne wrangler.json(c): wrangler hledá konfiguraci nahoru po adresářích v pořadí
# json → jsonc → toml, každý název zvlášť přes celý strom. Kořenový wrangler.jsonc by tak
# zastínil quotes-worker/wrangler.toml i worker/wrangler.toml (deploy by vzal konfiguraci webu).
#
# Jeden worker `izodiamant` – produkce i větvové náhledy (Preview podle doporučení Cloudflare,
# https://developers.cloudflare.com/workers/previews/). Dřív byl náhled samostatný worker
# `izodiamant-preview` (wrangler env) – to je v dashboardu druhá aplikace a Cloudflare od toho
# pro náhledy větví odrazuje.
#   produkce → aktivní deployment workeru (D1 izodiamant-db,         QUOTES → izodiamant-quotes)
#   Preview  → `npx wrangler preview`     (D1 izodiamant-preview-db, QUOTES → izodiamant-quotes-preview)
# Nasazuje .github/workflows/deploy-web.yml (master → produkce, ostatní větve → Preview větve).
#
# Domény izodiamant.cz a www jsou Custom Domains (DNS záznamy typu Worker spravuje Cloudflare).
# www → izodiamant.cz přesměrovává pravidlo zóny, ne worker.
#
# Secrety (nejsou tady, nastavují se zvlášť pro každé prostředí, viz deployment.MD §1.1):
#   CONTACT_EMAIL, TURNSTILE_SECRET_KEY,
#   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET
# Preview má vlastní sadu: `npx wrangler preview base-config secret put <NÁZEV>`.
# ADMIN_EMAILS není secret – je níže ve [vars] (hodnota z dashboardu by se při deployi přepsala).
# NEXT_PUBLIC_* se do kódu zapékají při buildu – bere je CI z GitHub Variables.
#
# Bindingy a vars se do [previews] NEDĚDÍ – při změně je upravte v obou blocích.

name = "izodiamant"
main = ".open-next/worker.js"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "izodiamant.cz", custom_domain = true },
  { pattern = "www.izodiamant.cz", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
ADMIN_EMAILS = "vichpetr@gmail.com,lcervenak843@gmail.com,vaclavropek31@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "izodiamant-db"
database_id = "ab044201-17db-44d4-8826-adfc65a4c18d"

[[services]]
binding = "QUOTES"
service = "izodiamant-quotes"

# Preview větví – `npx wrangler preview --name <větev>`. Běží pod stejným workerem,
# jen s vlastní adresou <větev>-izodiamant.<účet>.workers.dev a vlastními daty.
# Nedědí se nic kromě assets/compatibility_* – co má Preview mít, musí být tady.
[previews]

[previews.vars]
ADMIN_EMAILS = "vichpetr@gmail.com,lcervenak843@gmail.com,vaclavropek31@gmail.com"

[previews.observability]
enabled = true

[[previews.d1_databases]]
binding = "DB"
database_name = "izodiamant-preview-db"
database_id = "fb43aba4-c91a-4d90-8758-e473815ddee1"

# Service binding míří na aktivní deployment cílového workeru – proto testovací quotes-worker
# (vlastní schránka, D1 i R2), ne produkční.
[[previews.services]]
binding = "QUOTES"
service = "izodiamant-quotes-preview"
